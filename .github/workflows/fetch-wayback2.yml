name: Fetch Hero Realm Client v2

# 与 v1 相同，但会把抓取结果直接提交回仓库（results/），
# 便于在无法下载 artifact 的环境里直接用 raw.githubusercontent.com 读取。

on:
  workflow_dispatch:
    inputs:
      cmd:
        description: "执行模式：list / download / scan / probe / all"
        required: true
        default: "all"
      only:
        description: "只下载指定扩展名（如 swf,xml,png），留空=全部"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch from Wayback
        env:
          CMD: ${{ inputs.cmd }}
          ONLY: ${{ inputs.only }}
        run: |
          set -u
          ARGS=""
          if [ -n "${ONLY:-}" ]; then ARGS="$ARGS --only $ONLY"; fi
          python wayback_fetch.py "$CMD" --out wayback_yxzj --workers 4 $ARGS

      - name: Summarize
        if: always()
        run: |
          echo "===== 文件统计 ====="
          find wayback_yxzj -type f -printf '%s\t%p\n' 2>/dev/null | sort -k2 | head -n 200 || true
          echo "===== 总大小 ====="
          du -sh wayback_yxzj || true

      - name: Publish results to repo
        if: always()
        run: |
          mkdir -p results
          rsync -a --exclude='*.part' wayback_yxzj/ results/ 2>/dev/null || cp -r wayback_yxzj/. results/ || true
          git config user.name "hero-realm-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A results
          git commit -m "chore: wayback results $(date -u +%Y%m%d-%H%M%S)" || echo "nothing to commit"
          git push || echo "push failed"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-realm-wayback
          path: wayback_yxzj/**
          if-no-files-found: warn
          retention-days: 30
